name: Build ESP32 WebLed2.0

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_clean:
        description: "Выполнить idf.py fullclean перед сборкой"
        type: boolean
        default: true

concurrency:
  group: esp32-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 60

    defaults:
      run:
        shell: bash
        working-directory: /home/andrey/Project/WebLed2.0

    env:
      IDF_EXPORT: /home/andrey/esp/esp-idf/export.sh
      FW_BIN: build/WebLed2.0.bin

    steps:
      - name: Update repository
        run: |
          git fetch https://github.com/Anjuino/WebLed2.0.git main
          git checkout -f -B main FETCH_HEAD

      - name: Build firmware
        run: |
          source "$IDF_EXPORT"
          echo "ESP-IDF version: $(idf.py --version)"

          # inputs.full_clean приходит только при ручном запуске (workflow_dispatch).
          # При push inputs пустой, поэтому fullclean не выполняется.
          FULL_CLEAN="${{ inputs.full_clean }}"
          if [ "${FULL_CLEAN,,}" = "true" ]; then
            echo "Running idf.py fullclean..."
            idf.py fullclean
          fi

          idf.py build

      - name: Check firmware
        run: |
          if [ ! -f "$FW_BIN" ]; then
            echo "❌ Firmware not found: $FW_BIN"
            exit 1
          fi
          echo "✅ Firmware built successfully!"
          ls -lh "$FW_BIN"

      - name: Import firmware
        run: |
          cd /home/andrey/Project/webled-server/FirmwareImport
          echo "Importing firmware into DB..."
          dotnet run -- --repo /home/andrey/Project/WebLed2.0 --token 555707
          echo "✅ Firmware import completed"

          {
            echo "## Firmware"
            echo "- Build: ✅"
            echo "- Import: ✅"
            echo "- Binary: \`$FW_BIN\`"
          } >> "$GITHUB_STEP_SUMMARY"