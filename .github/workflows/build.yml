name: Build ESP32 WebLed2.0

on:
  push:
    branches: [main]

concurrency:
  group: esp32-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 60

    defaults:
      run:
        shell: bash
        working-directory: /home/andrey/Project/WebLed2.0

    env:
      IDF_EXPORT: /home/andrey/esp/esp-idf/export.sh
      FW_BIN: build/WebLed2.0.bin

    steps:
      - name: Update repository
        run: |
          git fetch https://github.com/Anjuino/WebLed2.0.git main
          git checkout -f -B main FETCH_HEAD

      - name: Clean and build firmware
        run: |
          source "$IDF_EXPORT"
          echo "ESP-IDF version: $(idf.py --version)"

          if [ -d build ]; then
            echo "Running idf.py fullclean..."
            idf.py fullclean
          fi

          idf.py build

      - name: Check firmware
        run: |
          if [ ! -f "$FW_BIN" ]; then
            echo "❌ Firmware not found: $FW_BIN"
            exit 1
          fi
          echo "✅ Firmware built successfully!"
          ls -lh "$FW_BIN"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebLed2.0-firmware
          path: /home/andrey/Project/WebLed2.0/build/WebLed2.0.bin
          if-no-files-found: error
          retention-days: 14

      - name: Import firmware
        run: |
          cd /home/andrey/Project/webled-server/FirmwareImport
          echo "Importing firmware into DB..."
          dotnet run -- --repo /home/andrey/Project/WebLed2.0 --token Ncyy0h3sLs219xiH
          echo "✅ Firmware import completed"

          {
            echo "## Firmware"
            echo "- Build: ✅"
            echo "- Import: ✅"
            echo "- Binary: \`$FW_BIN\`"
          } >> "$GITHUB_STEP_SUMMARY"
